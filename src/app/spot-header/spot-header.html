<div class="spot-header">
  <p class="spot-label">Aktueller Spot</p>
  <button class="spot-select-btn" (click)="openModal()">
    <span>{{ spot || 'Spot auswählen...' }}</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
</div>

@if (modalOpen) {
  <div class="spot-modal-overlay" (click)="closeModal()">
    <div class="spot-modal" (click)="$event.stopPropagation()">
      <div class="spot-modal-header">
        <h2 class="spot-modal-title">Spot</h2>
        <button class="spot-modal-close" (click)="closeModal()">✕</button>
      </div>
      <div class="spot-modal-body">
        <div class="spot-modal-field">
          <label class="spot-modal-label">Spot Name</label>
          <input
            type="text"
            class="spot-modal-input"
            [(ngModel)]="tempSpot"
            placeholder="z.B. Gardasee, Silvaplana..."
          />
        </div>
      </div>
      <div class="spot-modal-footer">
        <button class="spot-modal-cancel" (click)="closeModal()">Abbrechen</button>
        <button class="spot-modal-save" (click)="saveModal()">Speichern</button>
      </div>
    </div>
  </div>
}
